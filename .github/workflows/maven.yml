name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [ "main", "master", "testing" ]
  pull_request:
    branches: [ "main", "master", "testing" ]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./testing

    steps:
      # Step 1: Checkout the code from GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'testing/pom.xml'

      # Step 3: Grant execute permission for Maven Wrapper
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # Step 4: Run all Unit & Integration Tests and generate JaCoCo Report
      - name: Run Tests & Generate JaCoCo Report
        run: ./mvnw clean test

      # Step 5: Upload JaCoCo Coverage Report as a GitHub Artifact
      - name: Upload JaCoCo Test Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: testing/target/site/jacoco/
